    <circle cx="12" cy="12" r="9.5" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="2 2"/>
    <line x1="12" y1="12" x2="19" y2="5" stroke-width="2"/>
    <line x1="12" y1="1" x2="12" y2="3.5" stroke-width="1.6"/>
    <line x1="12" y1="20.5" x2="12" y2="23" stroke-width="1.6"/>
    <line x1="1" y1="12" x2="3.5" y2="12" stroke-width="1.6"/>
    <line x1="20.5" y1="12" x2="23" y2="12" stroke-width="1.6"/>
